<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소설 내지 발췌기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eceae5;
  --panel: #fbfaf7;
  --ink: #26231f;
  --muted: #7a746b;
  --line: #dcd8d0;
  --accent: #7a3b2e;
  --accent-ink: #fff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1c1a; --panel: #2a2926; --ink: #ece8e1; --muted: #a29b90; --line: #3d3a35; --accent: #d9886f; --accent-ink: #1d1c1a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
.side {
  background: var(--panel); border-right: 1px solid var(--line);
  overflow-y: auto; padding: 18px 16px 40px;
}
h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
fieldset { border: 0; border-top: 1px solid var(--line); margin: 14px 0 0; padding: 12px 0 0; }
legend { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; padding: 0 8px 0 0; text-transform: uppercase; }
label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
input[type=text], input[type=number], select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
}
textarea { height: 260px; resize: vertical; font-family: "Noto Serif KR", serif; font-size: 13px; line-height: 1.6; }
.chk { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink); margin: 7px 0 0; }
.chk input { margin: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
button {
  font: inherit; font-size: 13px; cursor: pointer; padding: 7px 12px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.hint { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; line-height: 1.55; }
.hint code { background: var(--bg); padding: 0 4px; border-radius: 3px; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.bar .stat { font-size: 13px; }
.bar .grow { flex: 1; }
.bar label { margin: 0; display: inline-flex; align-items: center; gap: 6px; }
.bar input[type=range] { width: 120px; }
.stage { flex: 1; overflow: auto; padding: 28px 18px 60px; }
.pages { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; align-items: flex-start; }
.pages.spread-mode { flex-direction: column; align-items: center; gap: 26px; flex-wrap: nowrap; }
.spread { display: flex; box-shadow: 0 2px 14px rgba(0,0,0,.2); }
.spread.first { justify-content: flex-end; }
.spread .page { box-shadow: none; }

/* ---- 내지 한 페이지 ---- */
.page {
  position: relative; background: #fffefb; color: #1b1a18; flex: none;
  box-shadow: 0 2px 14px rgba(0,0,0,.2); overflow: hidden;
}
.frame { position: absolute; overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; text-align: justify;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  letter-spacing: var(--ls); word-break: var(--wb); line-break: strict;
  orphans: 2; widows: 2; hanging-punctuation: first;
}
.flow p { margin: 0; text-indent: 1em; }
.flow p.noindent { text-indent: 0; }
.flow p.dlg.hang { text-indent: -1em; padding-left: 1em; }
.flow p.dlg.hang.noindent { text-indent: 0; padding-left: 0; }
.flow h2.chapter {
  break-before: column; break-after: avoid; margin: 0; text-align: center;
  font-weight: 700; font-size: 1.5em; line-height: 1.4; text-indent: 0; letter-spacing: .02em;
  padding: var(--drop) 0 3.2em;
}
.flow h2.chapter .no { display: block; font-size: .5em; font-weight: 400; letter-spacing: .3em; margin-bottom: 1em; opacity: .7; }
.flow .scene { text-align: center; text-indent: 0; margin: 0; letter-spacing: .6em; padding-left: .6em; break-inside: avoid; }
.hd, .ft {
  position: absolute; left: 0; right: 0; text-align: center; font-family: var(--font);
  font-size: 8pt; color: #6b665e; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hd.l { text-align: left; } .hd.r { text-align: right; }
.ft.l { text-align: left; } .ft.r { text-align: right; }
#measure { position: absolute; left: -99999px; top: 0; visibility: hidden; pointer-events: none; }
.empty { color: var(--muted); text-align: center; padding: 80px 0; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .main { height: auto; }
  .stage { overflow: visible; }
}
@media print {
  html, body { height: auto; background: none; }
  .side, .bar { display: none !important; }
  .app, .main { display: block; height: auto; }
  .stage { padding: 0; overflow: visible; }
  .pages, .pages.spread-mode { display: block; zoom: 1 !important; }
  .spread { display: contents; }
  .page { box-shadow: none !important; break-after: page; margin: 0; }
  .page:last-child { break-after: auto; }
}
</style>
<style id="pageRule"></style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>소설 내지 발췌기</h1>
    <p class="sub">원고를 붙여넣으면 A5·A6 등 판형에 맞춰 내지로 조판합니다.</p>

    <fieldset>
      <legend>원고</legend>
      <textarea id="src" spellcheck="false" placeholder="여기에 원고를 붙여넣으세요"></textarea>
      <p class="hint">
        <code># 제목</code> 챕터 시작 (새 페이지) · <code>***</code> 장면 전환<br>
        한 줄이 한 문단입니다. 따옴표로 시작하는 줄은 대사로 처리됩니다.
      </p>
      <div class="btns">
        <button id="btnSample">샘플</button>
        <button id="btnOpen">TXT 열기</button>
        <button id="btnClear">비우기</button>
        <input type="file" id="file" accept=".txt,text/plain" hidden>
      </div>
    </fieldset>

    <fieldset>
      <legend>판형</legend>
      <label for="size">규격</label>
      <select id="size">
        <option value="105,148">A6 (105 × 148)</option>
        <option value="148,210" selected>A5 (148 × 210)</option>
        <option value="128,182">B6 (128 × 182)</option>
        <option value="152,225">신국판 (152 × 225)</option>
        <option value="127,188">국판 (127 × 188)</option>
        <option value="custom">직접 입력</option>
      </select>
      <div class="row" id="customSize" hidden>
        <div><label>가로 mm</label><input type="number" id="cw" value="130" min="60" max="300"></div>
        <div><label>세로 mm</label><input type="number" id="ch" value="190" min="80" max="400"></div>
      </div>
      <div class="row3">
        <div><label>위 mm</label><input type="number" id="mt" value="18" min="0" step="1"></div>
        <div><label>아래 mm</label><input type="number" id="mb" value="20" min="0" step="1"></div>
        <div><label>안쪽 mm</label><input type="number" id="mi" value="20" min="0" step="1"></div>
      </div>
      <div class="row">
        <div><label>바깥쪽 mm</label><input type="number" id="mo" value="15" min="0" step="1"></div>
        <div></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>본문</legend>
      <label for="font">서체</label>
      <select id="font">
        <option value="'Nanum Myeongjo', 'Noto Serif KR', serif">나눔명조</option>
        <option value="'Noto Serif KR', serif">본명조 (Noto Serif KR)</option>
        <option value="'Gowun Batang', serif">고운바탕</option>
        <option value="'Noto Sans KR', sans-serif">본고딕 (Noto Sans KR)</option>
      </select>
      <div class="row3">
        <div><label>크기 pt</label><input type="number" id="fs" value="10" min="6" max="20" step="0.25"></div>
        <div><label>줄간격 %</label><input type="number" id="lh" value="170" min="110" max="260" step="5"></div>
        <div><label>자간 em</label><input type="number" id="ls" value="-0.01" min="-0.1" max="0.2" step="0.005"></div>
      </div>
      <label class="chk"><input type="checkbox" id="keep"> 어절 단위로 줄바꿈</label>
    </fieldset>

    <fieldset>
      <legend>문단 · 대사</legend>
      <label for="dlgStyle">대사 정렬</label>
      <select id="dlgStyle">
        <option value="indent">일반 들여쓰기 (한 칸)</option>
        <option value="hang">내어쓰기 (둘째 줄부터 한 칸 안으로)</option>
      </select>
      <label for="quote">따옴표</label>
      <select id="quote">
        <option value="curly">“ ” ‘ ’ 둥근 따옴표</option>
        <option value="corner">「 」 『 』 낫표</option>
        <option value="keep">원문 그대로</option>
      </select>
      <label class="chk"><input type="checkbox" id="firstFlush"> 챕터·장면 첫 문단은 들여쓰지 않음</label>
      <label class="chk"><input type="checkbox" id="auto" checked> “제1장”, “Chapter 1” 줄을 챕터로 자동 인식</label>
    </fieldset>

    <fieldset>
      <legend>머리말 · 쪽번호</legend>
      <label for="title">책 제목 (머리말)</label>
      <input type="text" id="title" placeholder="비워두면 머리말 없음">
      <label class="chk"><input type="checkbox" id="runChap" checked> 오른쪽 페이지에 챕터명 표시</label>
      <label for="pn">쪽번호</label>
      <select id="pn">
        <option value="center">하단 가운데</option>
        <option value="outer">하단 바깥쪽</option>
        <option value="none">없음</option>
      </select>
      <label class="chk"><input type="checkbox" id="pnSkip" checked> 챕터 첫 페이지는 쪽번호 생략</label>
    </fieldset>

    <fieldset>
      <legend>내보내기</legend>
      <div class="btns">
        <button class="primary" id="btnPrint">PDF로 저장 / 인쇄</button>
      </div>
      <p class="hint">인쇄 창에서 대상을 “PDF로 저장”으로, 여백은 “없음”, 배율은 100%로 설정하세요. 용지 크기는 판형에 맞게 자동 지정됩니다.</p>
    </fieldset>
  </aside>

  <main class="main">
    <div class="bar">
      <span class="stat" id="stat">–</span>
      <span class="grow"></span>
      <label class="chk" style="margin:0"><input type="checkbox" id="spread"> 펼침면 보기</label>
      <label>확대 <input type="range" id="zoom" min="40" max="160" value="90"></label>
    </div>
    <div class="stage"><div class="pages" id="pages"></div></div>
  </main>
</div>
<div id="measure"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MM = 96 / 25.4;                 // 1mm in CSS px
  const GAP = 24;                       // mm, 컬럼 간격 (보이지 않음)
  const KEY = 'novel-excerpt-v1';

  const SAMPLE = `# 제1장 첫눈
눈이 내리기 시작한 것은 정오를 조금 지났을 무렵이었다. 창가에 앉아 있던 하윤은 유리 위에 내려앉았다 사라지는 작은 결정들을 오래도록 바라보았다.
"올해는 좀 늦네."
등 뒤에서 목소리가 들렸다. 돌아보지 않아도 누구인지 알 수 있었다. 이 집에서 발소리를 내지 않고 걷는 사람은 한 명뿐이었다.
"늦은 게 아니라, 기다린 거겠지."
"무슨 뜻이야?"
"별 뜻 없어. 그냥 그런 기분이 들었어."
하윤은 컵을 두 손으로 감싸 쥐었다. 차는 이미 식어 있었지만 손바닥에 닿는 온기가 싫지 않았다. 말하지 않은 문장들이 방 안에 가라앉아 있었다.
***
저녁이 되자 눈발은 굵어졌다. 가로등 불빛 아래로 하얀 것들이 비스듬히 쏟아졌고, 골목은 어느새 소리를 잃었다.
"가자."
그가 외투를 건넸다. 하윤은 잠시 망설이다가 그것을 받아 들었다.
"어디로?"
"네가 처음 눈을 본 곳으로."
그 말에 하윤은 웃고 말았다. 처음 눈을 본 곳이라니, 그런 곳이 있을 리 없었다. 그러나 그가 너무 진지한 얼굴로 서 있었기 때문에, 웃음은 곧 입안에서 녹아 버렸다.

# 제2장 빈 의자
이튿날 아침, 하윤은 식탁 맞은편의 의자가 비어 있다는 사실을 한참 뒤에야 알아차렸다. 접시는 그대로였고 컵에는 물이 반쯤 남아 있었다.
"어디 갔지."
혼잣말이 방 안에 퍼졌다가 돌아왔다. 대답하는 사람은 없었다.
창밖의 눈은 밤새 쌓여 있었다. 발자국 하나 없는 마당을 가로질러, 하윤은 천천히 문 쪽으로 걸어갔다.`;

  const state = { rafId: 0, timer: 0 };

  /* ---------- 설정 읽기 / 저장 ---------- */
  const fieldIds = ['src','size','cw','ch','mt','mb','mi','mo','font','fs','lh','ls','keep','dlgStyle','quote','firstFlush','auto','title','runChap','pn','pnSkip','spread','zoom'];
  function readCfg() {
    const v = id => $(id).type === 'checkbox' ? $(id).checked : $(id).value;
    const num = (id, d) => { const n = parseFloat($(id).value); return isFinite(n) ? n : d; };
    let [pw, ph] = $('size').value === 'custom' ? [num('cw',130), num('ch',190)] : $('size').value.split(',').map(Number);
    return {
      pw, ph, mt: num('mt',18), mb: num('mb',20), mi: num('mi',20), mo: num('mo',15),
      font: v('font'), fs: num('fs',10), lh: num('lh',170) / 100, ls: num('ls',0),
      keep: v('keep'), dlgStyle: v('dlgStyle'), quote: v('quote'), firstFlush: v('firstFlush'), auto: v('auto'),
      title: v('title').trim(), runChap: v('runChap'), pn: v('pn'), pnSkip: v('pnSkip'),
    };
  }
  function save() {
    try {
      const o = {};
      fieldIds.forEach(id => o[id] = $(id).type === 'checkbox' ? $(id).checked : $(id).value);
      localStorage.setItem(KEY, JSON.stringify(o));
    } catch (e) {}
  }
  function load() {
    try {
      const o = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!o) return false;
      fieldIds.forEach(id => {
        if (!(id in o)) return;
        if ($(id).type === 'checkbox') $(id).checked = !!o[id]; else $(id).value = o[id];
      });
      return true;
    } catch (e) { return false; }
  }

  /* ---------- 원고 파서 ---------- */
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const OPEN = { '“':'d', '‘':'s', '「':'d', '『':'s' };
  const CLOSE = { '”':'d', '’':'s', '」':'d', '』':'s' };

  function convertQuotes(t, style) {
    if (style === 'keep') return t;
    const pair = style === 'corner' ? { d:['「','」'], s:['『','』'] } : { d:['“','”'], s:['‘','’'] };
    let out = '', openD = false, openS = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i], prev = t[i-1] || '', next = t[i+1] || '';
      if (c === '"') { out += openD ? pair.d[1] : pair.d[0]; openD = !openD; }
      else if (c === "'") {
        if (/[\p{L}\p{N}]/u.test(prev) && /[\p{L}\p{N}]/u.test(next)) out += '’';   // don't, 80's
        else { out += openS ? pair.s[1] : pair.s[0]; openS = !openS; }
      }
      else if (OPEN[c]) { out += pair[OPEN[c]][0]; if (OPEN[c]==='d') openD = true; else openS = true; }
      else if (CLOSE[c]) { out += pair[CLOSE[c]][1]; if (CLOSE[c]==='d') openD = false; else openS = false; }
      else out += c;
    }
    return out;
  }

  const AUTO_CH = /^(제\s*[0-9一二三四五六七八九十]+\s*[장화부편]\b.*|chapter\s+\d+\b.*|\d+\s*장\b.*|prologue|epilogue|프롤로그|에필로그)$/i;
  function parse(text, cfg) {
    const blocks = [];
    for (const raw of text.split(/\r?\n/)) {
      const line = raw.replace(/\s+$/,'').replace(/^[\s　]+/,'');
      if (!line) continue;
      let m;
      if ((m = line.match(/^#{1,3}\s+(.*)$/))) { blocks.push({ t:'chapter', text:m[1] }); continue; }
      if (/^(\*{3,}|-{3,}|(\*\s+){2,}\*|#{4,}|―{3,}|—{3,})$/.test(line)) { blocks.push({ t:'scene' }); continue; }
      if (cfg.auto && AUTO_CH.test(line)) { blocks.push({ t:'chapter', text:line }); continue; }
      const q = convertQuotes(line, cfg.quote);
      blocks.push({ t:'p', text:q, dlg: /^[“‘「『"']/.test(q) });
    }
    return blocks;
  }

  function buildHtml(blocks, cfg) {
    let html = '', fresh = false, ci = 0;
    for (const b of blocks) {
      if (b.t === 'chapter') {
        const m = b.text.match(/^(제\s*\d+\s*[장화부편]|chapter\s+\d+|\d+\s*장)\s*[.:·\-–—]?\s*(.*)$/i);
        html += m && m[2]
          ? `<h2 class="chapter" data-i="${ci}" data-title="${esc(m[2])}"><span class="no">${esc(m[1])}</span>${esc(m[2])}</h2>`
          : `<h2 class="chapter" data-i="${ci}" data-title="${esc(b.text)}">${esc(b.text)}</h2>`;
        ci++; fresh = true;
      } else if (b.t === 'scene') {
        html += `<p class="scene">*&nbsp;*&nbsp;*</p>`; fresh = true;
      } else {
        const cls = [];
        if (b.dlg) { cls.push('dlg'); if (cfg.dlgStyle === 'hang') cls.push('hang'); }
        if (fresh && cfg.firstFlush) cls.push('noindent');
        html += `<p${cls.length ? ` class="${cls.join(' ')}"` : ''}>${esc(b.text)}</p>`;
        fresh = false;
      }
    }
    return html;
  }

  /* ---------- 조판 ---------- */
  function applyFlowStyle(el, cfg, cw, chh) {
    const s = el.style;
    s.setProperty('--font', cfg.font);
    s.setProperty('--fs', cfg.fs + 'pt');
    s.setProperty('--lh', cfg.lh);
    s.setProperty('--ls', cfg.ls + 'em');
    s.setProperty('--wb', cfg.keep ? 'keep-all' : 'normal');
    s.setProperty('--drop', (chh * 0.16) + 'mm');
    s.width = cw + 'mm';
    s.height = chh + 'mm';
    s.columnWidth = cw + 'mm';
    s.columnGap = GAP + 'mm';
  }

  function paginate() {
    const cfg = readCfg();
    const cw = Math.max(20, cfg.pw - cfg.mi - cfg.mo);
    const chh = Math.max(20, cfg.ph - cfg.mt - cfg.mb);
    const blocks = parse($('src').value, cfg);
    const host = $('pages');

    $('pageRule').textContent = `@page { size: ${cfg.pw}mm ${cfg.ph}mm; margin: 0; }`;

    if (!blocks.length) {
      host.innerHTML = '<div class="empty">원고를 입력하면 이곳에 내지가 표시됩니다.</div>';
      $('stat').textContent = '0쪽';
      return;
    }

    const html = buildHtml(blocks, cfg);
    const meas = $('measure');
    meas.innerHTML = `<div class="flow" id="mflow">${html}</div>`;
    const mf = $('mflow');
    applyFlowStyle(mf, cfg, cw, chh);

    const step = (cw + GAP) * MM;
    const base = mf.getBoundingClientRect().left;
    const n = Math.max(1, Math.round((mf.scrollWidth + GAP * MM) / step));

    // 챕터가 시작되는 페이지
    const chapters = [...mf.querySelectorAll('h2.chapter')].map(h => ({
      title: h.dataset.title,
      page: Math.floor((h.getBoundingClientRect().left - base) / step + 0.02),
    }));
    const startPages = new Set(chapters.map(c => c.page));

    const frag = document.createDocumentFragment();
    const pageEls = [];
    for (let i = 0; i < n; i++) {
      const odd = (i + 1) % 2 === 1;                   // 오른쪽(홀수) 페이지는 제본면이 왼쪽
      const left = odd ? cfg.mi : cfg.mo;
      const page = document.createElement('div');
      page.className = 'page';
      page.style.width = cfg.pw + 'mm';
      page.style.height = cfg.ph + 'mm';
      page.style.setProperty('--font', cfg.font);

      const frame = document.createElement('div');
      frame.className = 'frame';
      Object.assign(frame.style, { left: left + 'mm', top: cfg.mt + 'mm', width: cw + 'mm', height: chh + 'mm' });
      const flow = document.createElement('div');
      flow.className = 'flow';
      flow.innerHTML = html;
      applyFlowStyle(flow, cfg, cw, chh);
      flow.style.transform = `translateX(${-i * (cw + GAP)}mm)`;
      frame.appendChild(flow);
      page.appendChild(frame);

      const isStart = startPages.has(i);
      let cur = null;
      for (const c of chapters) if (c.page <= i) cur = c;

      // 머리말
      if (!isStart) {
        let hd = '', cls = 'hd';
        if (!odd && cfg.title) hd = cfg.title;
        else if (odd && cfg.runChap && cur) hd = cur.title;
        else if (odd && cfg.title && !cfg.runChap) hd = cfg.title;
        if (hd) {
          const e = document.createElement('div');
          e.className = cls;
          e.textContent = hd;
          Object.assign(e.style, { top: Math.max(4, cfg.mt * 0.5 - 2) + 'mm', left: left + 'mm', right: (cfg.pw - left - cw) + 'mm' });
          page.appendChild(e);
        }
      }
      // 쪽번호
      if (cfg.pn !== 'none' && !(cfg.pnSkip && isStart)) {
        const e = document.createElement('div');
        e.className = 'ft' + (cfg.pn === 'outer' ? (odd ? ' r' : ' l') : '');
        e.textContent = i + 1;
        Object.assign(e.style, { bottom: Math.max(4, cfg.mb * 0.5 - 2) + 'mm', left: left + 'mm', right: (cfg.pw - left - cw) + 'mm' });
        page.appendChild(e);
      }
      pageEls.push(page);
    }

    // 배치: 낱장 / 펼침면
    host.innerHTML = '';
    const spreadMode = $('spread').checked;
    host.classList.toggle('spread-mode', spreadMode);
    if (spreadMode) {
      for (let i = 0; i < pageEls.length; ) {
        const sp = document.createElement('div');
        sp.className = 'spread';
        if (i === 0) { sp.classList.add('first'); sp.style.width = (cfg.pw * 2) + 'mm'; sp.appendChild(pageEls[i]); i += 1; }
        else { sp.appendChild(pageEls[i]); if (pageEls[i+1]) sp.appendChild(pageEls[i+1]); i += 2; }
        frag.appendChild(sp);
      }
    } else pageEls.forEach(p => frag.appendChild(p));
    host.appendChild(frag);

    const chars = blocks.filter(b => b.t === 'p').reduce((a, b) => a + b.text.length, 0);
    $('stat').textContent = `${n}쪽 · ${chapters.length}개 챕터 · 본문 ${chars.toLocaleString()}자`;
    applyZoom();
  }

  function applyZoom() { $('pages').style.zoom = $('zoom').value / 100; }

  function schedule() {
    clearTimeout(state.timer);
    state.timer = setTimeout(() => { save(); paginate(); }, 180);
  }

  /* ---------- 이벤트 ---------- */
  fieldIds.forEach(id => {
    const ev = ($(id).tagName === 'SELECT' || $(id).type === 'checkbox' || $(id).type === 'range') ? 'change' : 'input';
    $(id).addEventListener(ev, () => {
      if (id === 'size') $('customSize').hidden = $('size').value !== 'custom';
      if (id === 'zoom') { applyZoom(); save(); return; }
      schedule();
    });
  });
  $('zoom').addEventListener('input', applyZoom);
  $('btnSample').onclick = () => { $('src').value = SAMPLE; if (!$('title').value) $('title').value = '첫눈'; schedule(); };
  $('btnClear').onclick = () => { $('src').value = ''; schedule(); };
  $('btnOpen').onclick = () => $('file').click();
  $('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('src').value = r.result; schedule(); };
    r.readAsText(f, 'utf-8');
    e.target.value = '';
  };
  $('btnPrint').onclick = () => window.print();

  /* ---------- 시작 ---------- */
  if (!load()) { $('src').value = SAMPLE; $('title').value = '첫눈'; }
  $('customSize').hidden = $('size').value !== 'custom';
  paginate();
  if (document.fonts) {
    document.fonts.ready.then(paginate);
    document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => schedule());
  }
})();
</script>
</body>
</html>
